const {
  useState,
  useEffect
} = React;
// API base: production follows current admin domain to avoid CORS after domain changes.
// Local preview can override with ?api_base=https://your-domain or localStorage.admin_api_base.
const stripTrailingSlash = value => String(value || '').replace(/\/$/, '');
const API_BASE_OVERRIDE = new URLSearchParams(window.location.search).get('api_base') || localStorage.getItem('admin_api_base') || '';
if (API_BASE_OVERRIDE) {
  localStorage.setItem('admin_api_base', stripTrailingSlash(API_BASE_OVERRIDE));
}
const API_BASE = stripTrailingSlash(API_BASE_OVERRIDE || window.location.origin);
const API_FALLBACK_BASES = API_BASE_OVERRIDE ? [] : ['http://127.0.0.1:3000', 'http://localhost:3000'].filter(base => stripTrailingSlash(base) !== API_BASE);
const buildApiUrl = (base, url) => stripTrailingSlash(base) + url;
const requestWithFallback = async (url, options = {}) => {
  const bases = [API_BASE, ...API_FALLBACK_BASES];
  let lastError = null;
  for (const base of bases) {
    try {
      return await fetch(buildApiUrl(base, url), options);
    } catch (error) {
      lastError = error;
    }
  }
  throw lastError || new Error('网络请求失败');
};

// Token管理
const getToken = () => {
  return localStorage.getItem('admin_token');
};
const setToken = token => {
  if (token) {
    console.log('保存token到localStorage, 长度:', token.length);
    localStorage.setItem('admin_token', token);
    console.log('Token已保存:', token.substring(0, 50) + '...');
  } else {
    console.log('清除token');
    localStorage.removeItem('admin_token');
  }
};

// API工具函数
const api = {
  get: async (url, params = {}) => {
    const queryString = Object.keys(params).map(key => `${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`).join('&');
    const baseUrl = API_BASE;
    const requestUrl = queryString ? `${url}?${queryString}` : url;
    console.log('API GET请求URL:', API_BASE + requestUrl);
    const token = getToken();
    const headers = {};
    if (token) {
      headers['Authorization'] = `Bearer ${token}`;
      headers['X-Admin-Token'] = token;
    }
    try {
      const response = await requestWithFallback(requestUrl, {
        headers,
        credentials: 'include'
      });
      console.log('API响应状态:', response.status);
      const result = await response.json();
      console.log('API响应数据:', result);
      return result;
    } catch (error) {
      console.error('API请求失败:', error);
      throw error;
    }
  },
  post: async (url, data) => {
    console.log('API POST请求URL:', API_BASE + url);
    console.log('请求数据:', data);
    const token = getToken();
    console.log('Token状态:', token ? '存在' : '不存在');
    console.log('Token内容:', token ? token.substring(0, 50) + '...' : '无');
    const headers = {
      'Content-Type': 'application/json'
    };
    if (token) {
      headers['Authorization'] = `Bearer ${token}`;
      headers['X-Admin-Token'] = token;
      console.log('已设置Authorization头');
    } else {
      console.warn('未设置Authorization头 - token为空');
    }
    try {
      const response = await requestWithFallback(url, {
        method: 'POST',
        headers: headers,
        credentials: 'include',
        body: JSON.stringify(data)
      });
      console.log('API响应状态:', response.status);
      const result = await response.json();
      console.log('API响应数据:', result);
      return result;
    } catch (error) {
      console.error('API请求失败:', error);
      const hint = !API_BASE_OVERRIDE ? '如果后端在别的域名，打开后台时加 ?api_base=https://你的后端域名' : '';
      throw new Error((error && error.message ? error.message : '网络请求失败') + (hint ? '。' + hint : ''));
    }
  }
};
