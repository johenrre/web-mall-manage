server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compose 健康检查使用；不依赖后端。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API 和上传由宿主机 Nginx 的 v2 虚拟主机转发到 backend。
    # 直接访问 admin 容器时不提供这两个路径，避免误把请求当成静态文件。
    location ^~ /api/ { return 404; }
    location ^~ /uploads/ { return 404; }

    # Vue Router history fallback。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建后的静态资源带哈希，可缓存较长时间。
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
